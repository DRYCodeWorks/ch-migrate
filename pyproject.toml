[project]
name = "ch-migrate-cli"
dynamic = ["version"]
description = "SQL-first ClickHouse schema migrations across environments: the ch-migrate command"
authors = [{ name = "Dan Young" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["clickhouse", "migrations", "schema-migrations", "database", "schema", "clickhouse-cloud", "alembic", "ch-migrate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    "alembic>=1.14.0", # version_table_impl supplies ClickHouse's engine in offline SQL
    "boto3>=1.42.24",
    "click>=8.1.0",
    "clickhouse-connect>=0.7.0",
    "clickhouse-sqlalchemy>=0.3.0", # Required for Alembic's SQLAlchemy dialect
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/DRYCodeWorks/ch-migrate"
Repository = "https://github.com/DRYCodeWorks/ch-migrate"
Issues = "https://github.com/DRYCodeWorks/ch-migrate/issues"
Guide = "https://www.drycodeworks.com/articles/dev-guides/clickhouse-migrations-with-alembic"

[project.scripts]
ch-migrate = "ch_migrate.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ch_migrate/__init__.py"

[tool.hatch.build.targets.wheel]
# clickhouse_alembic is the pre-0.5 import name, kept as a deprecated alias until 1.0.
packages = ["ch_migrate", "clickhouse_alembic"]

[tool.hatch.build.targets.sdist]
include = ["ch_migrate", "clickhouse_alembic", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "types-PyYAML",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "clickhouse_connect.*",
    "clickhouse_sqlalchemy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["integration: tests against a real, isolated ClickHouse server"]
addopts = "-m 'not integration'"
