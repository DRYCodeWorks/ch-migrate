name: release

# Pushing a tag vX.Y.Z publishes that version to PyPI as `ch-migrate-cli`
# (the CLI it installs is `ch-migrate`) and creates the matching GitHub release.
# Releases up to 0.4.1 were published as `clickhouse-alembic`.
#
# No token: PyPI trusts this workflow through Trusted Publishing (OIDC).
# PyPI publisher for project ch-migrate-cli: owner DRYCodeWorks, repository
# clickhouse-migrate, workflow release.yml, no environment.
#
# To release: set __version__ in ch_migrate/__init__.py, commit,
# then `git tag vX.Y.Z && git push origin vX.Y.Z`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0 (no floating major tag)

      - name: The tag matches the package version
        run: |
          version=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("ch_migrate/__init__.py").read()).group(1))')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
